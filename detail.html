<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>LUNÉRA — Product</title>
<meta name="description" content="Discover LUNÉRA — Elegance in Every Layer.">

<link rel="icon" type="image/png" href="/lunera/lunera-logo.png?v=7">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,400;6..96,500;6..96,600&family=Cormorant+Garamond:wght@400;500;600&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html{
  scroll-behavior:smooth;
}

body{
  background:#f7f4ef;
  color:#151212;
  font-family:"Montserrat",sans-serif;
}

a{
  color:inherit;
  text-decoration:none;
}

button,
input{
  font-family:inherit;
}

/* HEADER */

header{
  height:86px;
  padding:0 6%;
  display:flex;
  align-items:center;
  justify-content:space-between;
  border-bottom:1px solid rgba(21,18,18,.12);
  background:#f7f4ef;
  position:sticky;
  top:0;
  z-index:50;
}

.logo{
  font-family:"Bodoni Moda",serif;
  font-size:31px;
  letter-spacing:5px;
  font-weight:500;
}

nav{
  display:flex;
  align-items:center;
  gap:32px;
  font-size:11px;
  letter-spacing:2px;
  text-transform:uppercase;
}

nav a{
  transition:.25s ease;
}

nav a:hover{
  opacity:.55;
}

.bag{
  display:flex;
  align-items:center;
  gap:8px;
}

.bag-count{
  min-width:20px;
  height:20px;
  border-radius:50%;
  background:#17352b;
  color:#fff;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  font-size:9px;
  letter-spacing:0;
}

/* MAIN */

.page{
  max-width:1380px;
  margin:auto;
  padding:70px 6% 100px;
}

.back{
  display:inline-block;
  margin-bottom:40px;
  font-size:10px;
  letter-spacing:2px;
  text-transform:uppercase;
  border-bottom:1px solid #151212;
  padding-bottom:5px;
}

/* PRODUCT */

.product-layout{
  display:grid;
  grid-template-columns:minmax(0,1.1fr) minmax(360px,.9fr);
  gap:80px;
  align-items:start;
}

.product-image-wrap{
  background:#eee9e1;
  min-height:650px;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
}

.product-image{
  width:100%;
  height:650px;
  object-fit:contain;
  display:block;
}

.product-info{
  padding-top:20px;
  max-width:540px;
}

.category{
  font-size:10px;
  letter-spacing:3px;
  text-transform:uppercase;
  color:#17352b;
  margin-bottom:18px;
}

.product-name{
  font-family:"Bodoni Moda",serif;
  font-size:clamp(42px,5vw,72px);
  font-weight:400;
  line-height:1;
  margin-bottom:22px;
}

.price{
  font-family:"Cormorant Garamond",serif;
  font-size:30px;
  margin-bottom:35px;
}

.description{
  font-family:"Cormorant Garamond",serif;
  font-size:21px;
  line-height:1.55;
  color:#403b37;
  margin-bottom:38px;
}

.option-title{
  font-size:10px;
  letter-spacing:2px;
  text-transform:uppercase;
  margin-bottom:12px;
}

.sizes{
  display:flex;
  flex-wrap:wrap;
  gap:9px;
  margin-bottom:30px;
}

.size-btn{
  min-width:48px;
  height:43px;
  padding:0 14px;
  background:transparent;
  border:1px solid rgba(21,18,18,.3);
  cursor:pointer;
  font-size:11px;
  transition:.2s ease;
}

.size-btn:hover,
.size-btn.active{
  background:#17352b;
  border-color:#17352b;
  color:white;
}

.quantity-row{
  display:flex;
  align-items:center;
  gap:18px;
  margin-bottom:30px;
}

.quantity{
  display:flex;
  align-items:center;
  border:1px solid rgba(21,18,18,.25);
}

.quantity button{
  width:42px;
  height:42px;
  border:0;
  background:transparent;
  cursor:pointer;
  font-size:18px;
}

.quantity span{
  width:42px;
  text-align:center;
  font-size:12px;
}

.add-btn{
  width:100%;
  min-height:56px;
  border:1px solid #17352b;
  background:#17352b;
  color:white;
  font-size:11px;
  letter-spacing:2px;
  text-transform:uppercase;
  cursor:pointer;
  transition:.25s ease;
  margin-bottom:12px;
}

.add-btn:hover{
  background:#10271f;
}

.buy-btn{
  width:100%;
  min-height:56px;
  border:1px solid #151212;
  background:transparent;
  color:#151212;
  font-size:11px;
  letter-spacing:2px;
  text-transform:uppercase;
  cursor:pointer;
  transition:.25s ease;
}

.buy-btn:hover{
  background:#151212;
  color:white;
}

.notice{
  min-height:22px;
  margin-top:15px;
  font-size:11px;
  letter-spacing:.5px;
  color:#17352b;
}

/* DETAILS */

.product-details{
  margin-top:90px;
  padding-top:45px;
  border-top:1px solid rgba(21,18,18,.14);
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:60px;
}

.detail-title{
  font-family:"Bodoni Moda",serif;
  font-size:30px;
  margin-bottom:18px;
  font-weight:400;
}

.detail-text{
  font-family:"Cormorant Garamond",serif;
  font-size:19px;
  line-height:1.6;
  color:#49443f;
}

.info-list{
  list-style:none;
  border-top:1px solid rgba(21,18,18,.12);
}

.info-list li{
  padding:15px 0;
  border-bottom:1px solid rgba(21,18,18,.12);
  display:flex;
  justify-content:space-between;
  gap:20px;
  font-size:11px;
  letter-spacing:1px;
}

.info-list span:last-child{
  color:#6d6862;
  text-align:right;
}

/* FOOTER */

footer{
  background:#151212;
  color:#f7f4ef;
  padding:70px 6% 35px;
}

.footer-grid{
  max-width:1380px;
  margin:auto;
  display:grid;
  grid-template-columns:2fr 1fr 1fr 1fr;
  gap:50px;
}

.footer-brand{
  font-family:"Bodoni Moda",serif;
  font-size:32px;
  letter-spacing:5px;
  margin-bottom:15px;
}

.footer-tagline{
  font-family:"Cormorant Garamond",serif;
  font-size:19px;
  color:#cfc8bf;
}

.footer-heading{
  font-size:10px;
  letter-spacing:2px;
  margin-bottom:20px;
  color:#cfc8bf;
}

.footer-links{
  display:flex;
  flex-direction:column;
  gap:11px;
}

.footer-links a{
  font-size:11px;
  color:#f7f4ef;
  transition:.2s;
}

.footer-links a:hover{
  opacity:.55;
}

.footer-bottom{
  max-width:1380px;
  margin:60px auto 0;
  padding-top:22px;
  border-top:1px solid rgba(247,244,239,.16);
  display:flex;
  justify-content:space-between;
  gap:20px;
  font-size:9px;
  letter-spacing:1.5px;
  color:#aaa39b;
}

.developer-link{
  color:#aaa39b;
}

/* ERROR */

.not-found{
  text-align:center;
  padding:120px 20px;
}

.not-found h1{
  font-family:"Bodoni Moda",serif;
  font-size:55px;
  font-weight:400;
  margin-bottom:20px;
}

.not-found p{
  font-family:"Cormorant Garamond",serif;
  font-size:21px;
  margin-bottom:30px;
}

.not-found a{
  display:inline-block;
  background:#17352b;
  color:white;
  padding:16px 25px;
  font-size:10px;
  letter-spacing:2px;
  text-transform:uppercase;
}

/* RESPONSIVE */

@media(max-width:900px){

  header{
    height:auto;
    min-height:76px;
    padding:18px 5%;
    gap:20px;
  }

  nav{
    gap:16px;
    font-size:9px;
  }

  .product-layout{
    grid-template-columns:1fr;
    gap:45px;
  }

  .product-image-wrap,
  .product-image{
    min-height:500px;
    height:500px;
  }

  .product-info{
    max-width:none;
  }

  .product-details{
    grid-template-columns:1fr;
    gap:45px;
  }

  .footer-grid{
    grid-template-columns:1fr 1fr;
  }
}

@media(max-width:600px){

  header{
    flex-direction:column;
    align-items:flex-start;
  }

  nav{
    width:100%;
    justify-content:space-between;
    gap:10px;
    flex-wrap:wrap;
  }

  .page{
    padding:45px 5% 70px;
  }

  .product-image-wrap,
  .product-image{
    min-height:420px;
    height:420px;
  }

  .product-name{
    font-size:45px;
  }

  .description{
    font-size:19px;
  }

  .footer-grid{
    grid-template-columns:1fr;
  }

  .footer-bottom{
    flex-direction:column;
  }
}
</style>
</head>

<script>

const defaults = [

    description:"A delicate lace-inspired silhouette with a sophisticated finish."
  },

  {
    id:8,

    price:60,
    category:"Essentials",
    sizes:["S","M","L","XL"],
    image:"https://images.unsplash.com/photo-1566206091558-7f218b696731?auto=format&fit=crop&w=1000&q=85",
    description:"An understated wardrobe essential designed for everyday ease."
  },

  {
    id:9,
    name:"The Bridal Collection",
    price:175,
    category:"Lingerie Sets",
    sizes:["S","M","L"],
    image:"https://images.unsplash.com/photo-1596755389378-c31d21fd1273?auto=format&fit=crop&w=1000&q=85",
    description:"A refined bridal-inspired collection celebrating elegance and timeless detail."
  }

];


/* SECURITY / DISPLAY */

function escapeHTML(value){

  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


/* PRODUCTS */

function getProducts(){

  const saved =
    localStorage.getItem("luneraProducts");

  if(saved){

    try{
      const parsed=JSON.parse(saved);

      if(Array.isArray(parsed) && parsed.length){
        return parsed;
      }

    }catch(error){
      console.warn("Could not read saved products.");
    }

  }

  return JSON.parse(
    JSON.stringify(defaults)
  );

}


/* CATEGORIES */

function getCategories(){

  const defaultCategories=[
    "Bras",
    "Panties",
    "Lingerie Sets",
    "Nightwear",
    "Essentials"
  ];

  const saved=
    localStorage.getItem("luneraCategories");

  if(saved){

    try{

      const parsed=JSON.parse(saved);

      if(Array.isArray(parsed)){
        return parsed;
      }

    }catch(error){
      console.warn("Could not read saved categories.");
    }

  }

  return defaultCategories;

}


/* SLUG */

function makeSlug(value){

  return String(value || "")
    .toLowerCase()
    .trim()
    .replace(/[^a-z0-9]+/g,"-")
    .replace(/^-+|-+$/g,"");

}


/* GET PRODUCT */

function getProduct(){

  const params=
    new URLSearchParams(window.location.search);

  const value=
    params.get("product");

  const products=
    getProducts();

  if(!products.length){
    return null;
  }

  /*
    If no product parameter exists,
    open the first product.
  */

  if(!value){
    return products[0];
  }

  const decoded=
    decodeURIComponent(value).trim();

  /*
    1. Find by ID
  */

  let product=
    products.find(
      p => String(p.id) === decoded
    );

  if(product){
    return product;
  }

  /*
    2. Find by exact product name
  */

  product=
    products.find(
      p =>
        String(p.name || "")
          .trim()
          .toLowerCase()
        ===
        decoded.toLowerCase()
    );

  if(product){
    return product;
  }

  /*
    3. Find by slug
  */

  const requestedSlug=
    makeSlug(decoded);

  product=
    products.find(
      p =>
        makeSlug(p.name) === requestedSlug
    );

  if(product){
    return product;
  }

  return null;

}


/* BAG COUNT */

function updateBagCount(){

  const bag=
    JSON.parse(
      localStorage.getItem("luneraCart") || "[]"
    );

  const count=
    bag.reduce(
      (total,item)=>
        total + Number(item.quantity || 1),
      0
    );

  const el=
    document.getElementById("bagCount");

  if(el){
    el.textContent=count;
  }

}


/* FOOTER */

function renderFooter(){

  const categories=
    getCategories();

  const footer=
    document.getElementById("footerCategories");

  if(footer){

    footer.innerHTML=
      categories
        .map(category=>`

          <a href="product.html?category=${encodeURIComponent(category)}">
            ${escapeHTML(category)}
          </a>

        `)
        .join("");

  }

  const manageLink=
    document.getElementById("manageLink");

  if(
    manageLink &&
    sessionStorage.getItem("luneraAdmin")==="yes"
  ){

    manageLink.style.display="block";

  }

}


/* RENDER PRODUCT */

function renderProduct(){

  const product=
    getProduct();

  const main=
    document.getElementById("mainContent");

  if(!product){

    main.innerHTML=`

      <div class="not-found">

        <h1>Product Not Found</h1>

        <p>
          This piece is no longer available in the collection.
        </p>

        <a href="product.html">
          View Collection
        </a>

      </div>

    `;

    return;

  }


  const sizes=
    Array.isArray(product.sizes) &&
    product.sizes.length
      ? product.sizes
      : ["S","M","L"];


  main.innerHTML=`

    <a href="product.html" class="back">
      ← Back to Collection
    </a>


    <section class="product-layout">


      <div class="product-image-wrap">

        <img
          src="${escapeHTML(product.image)}"
          alt="${escapeHTML(product.name)}"
          class="product-image"

          onerror="
            this.src='https://images.unsplash.com/photo-1483985988355-763728e1935b?auto=format&fit=crop&w=1200&q=85'
          "
        >

      </div>


      <div class="product-info">


        <div class="category">
          ${escapeHTML(product.category)}
        </div>


        <h1 class="product-name">
          ${escapeHTML(product.name)}
        </h1>


        <div class="price">
          $${Number(product.price || 0).toFixed(2)}
        </div>


        <p class="description">
          ${escapeHTML(
            product.description ||
            "A refined LUNÉRA essential designed with elegance and ease."
          )}
        </p>


        <div class="option-title">
          Select Size
        </div>


        <div class="sizes" id="sizes">

          ${sizes.map((size,index)=>`

            <button
              class="size-btn ${index===0 ? "active" : ""}"
              data-size="${escapeHTML(size)}"
              onclick="selectSize(this)"
            >
              ${escapeHTML(size)}
            </button>

          `).join("")}

        </div>


        <div class="option-title">
          Quantity
        </div>


        <div class="quantity-row">

          <div class="quantity">

            <button onclick="changeQuantity(-1)">
              −
            </button>

            <span id="quantity">
              1
            </span>

            <button onclick="changeQuantity(1)">
              +
            </button>

          </div>

        </div>


        <button
          class="add-btn"
          onclick="addToBag()"
        >
          Add to Bag
        </button>


        <button
          class="buy-btn"
          onclick="buyNow()"
        >
          Buy Now
        </button>


        <div
          class="notice"
          id="notice"
        ></div>


      </div>

    </section>


    <section class="product-details">


      <div>

        <h2 class="detail-title">
          The LUNÉRA Edit
        </h2>

        <p class="detail-text">
          Designed around understated luxury, each LUNÉRA piece
          is created to become part of your everyday wardrobe.
          Thoughtful silhouettes and timeless styling define the collection.
        </p>

      </div>


      <div>

        <h2 class="detail-title">
          Product Information
        </h2>

        <ul class="info-list">

          <li>
            <span>Category</span>
            <span>
              ${escapeHTML(product.category)}
            </span>
          </li>

          <li>
            <span>Available Sizes</span>
            <span>
              ${sizes.map(escapeHTML).join(", ")}
            </span>
          </li>

          <li>
            <span>Shipping</span>
            <span>
              Complimentary over $150
            </span>
          </li>

          <li>
            <span>Returns</span>
            <span>
              See return policy
            </span>
          </li>

        </ul>

      </div>


    </section>

  `;


  window.selectedSize=
    sizes[0];

  window.selectedQuantity=1;

}


/* SIZE */

function selectSize(button){

  document
    .querySelectorAll(".size-btn")
    .forEach(btn =>
      btn.classList.remove("active")
    );

  button.classList.add("active");

  window.selectedSize=
    button.dataset.size;

}


/* QUANTITY */

function changeQuantity(amount){

  let quantity=
    Number(window.selectedQuantity || 1);

  quantity+=amount;

  if(quantity<1){
    quantity=1;
  }

  if(quantity>20){
    quantity=20;
  }

  window.selectedQuantity=
    quantity;

  const el=
    document.getElementById("quantity");

  if(el){
    el.textContent=quantity;
  }

}


/* ADD TO BAG */

function addToBag(){

  const product=
    getProduct();

  if(!product){
    return;
  }

  const cart=
    JSON.parse(
      localStorage.getItem("luneraCart") || "[]"
    );

  const size=
    window.selectedSize ||
    (
      Array.isArray(product.sizes) &&
      product.sizes.length
        ? product.sizes[0]
        : "Standard"
    );

  const quantity=
    Number(
      window.selectedQuantity || 1
    );


  const existing=
    cart.find(
      item =>
        String(item.id) ===
          String(product.id) &&
        item.size === size
    );


  if(existing){

    existing.quantity=
      Number(existing.quantity || 0)
      + quantity;

  }else{

    cart.push({

      id:product.id,

      name:product.name,

      price:Number(product.price || 0),

      category:product.category,

      image:product.image,

      size:size,

      quantity:quantity

    });

  }


  localStorage.setItem(
    "luneraCart",
    JSON.stringify(cart)
  );


  updateBagCount();


  const notice=
    document.getElementById("notice");


  if(notice){

    notice.textContent=
      `${product.name} — ${size} added to your bag.`;

  }

}


/* BUY NOW */

function buyNow(){

  addToBag();

  setTimeout(()=>{

    window.location.href=
      "cart.html";

  },250);

}


/* STORAGE UPDATE */

window.addEventListener(
  "storage",
  ()=>{

    updateBagCount();
    renderFooter();

  }
);


/* START */

renderProduct();

renderFooter();

updateBagCount();

</script>
